name: Agencia Autónoma - Control de Seguridad
on:
  push:
    branches: [agencia-autonoma-infra]
    paths:
      - 'agencia-autonoma/**'
      - '.github/workflows/agencia-autonoma-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agencia-autonoma-qa
  cancel-in-progress: true
jobs:
  safe-tests:
    if: github.repository == 'adedramaa/freellmapi'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify agency unit tests without credentials
        run: node --test agencia-autonoma/tests/*.test.mjs
      - name: Validate isolated agent handoff without calling AI or payment providers
        run: node --test agencia-autonoma/runner/*.test.mjs
      - name: Prove a clean standalone private-agency seed can be built without customer data
        shell: bash
        run: |
          set -euo pipefail
          node agencia-autonoma/runner/export-private-seed.mjs --output "$RUNNER_TEMP/agency-private-seed" --target adedramaa/autonoma-dev-agencia-private
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {join} from 'node:path';
          const root=process.env.RUNNER_TEMP+'/agency-private-seed';
          const manifest=JSON.parse(await readFile(join(root,'migration-manifest.json'),'utf8'));
          if(!manifest.ci_only_manual||manifest.excludes_crm_records!==true||manifest.files.length<25)throw Error('incomplete_private_seed');
          for(const f of manifest.files){
            if(!/^(agencia-autonoma\/|\.claude\/skills\/agencia-|\.github\/workflows\/agency-qa.yml$|README_PRIVATE_MIGRATION.md$)/.test(f.path))throw Error('unexpected_file:'+f.path);
            const bytes=await readFile(join(root,f.path));
            if(createHash('sha256').update(bytes).digest('hex')!==f.sha256)throw Error('invalid_sha256:'+f.path);
          }
          console.log('PASS: verified standalone seed files='+manifest.files.length);
          NODE
      - name: Verify exported seed passes QA without original repository files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/agency-private-seed"
          node --test agencia-autonoma/tests/*.test.mjs
          node --test agencia-autonoma/runner/*.test.mjs
      - name: Preserve reviewed agency-only migration seed for Android download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agencia-privada-solo-codigo
          path: ${{ runner.temp }}/agency-private-seed/
          if-no-files-found: error
          retention-days: 7
      - name: Produce and verify offline fictional website artifact
        shell: bash
        run: |
          set -euo pipefail
          node agencia-autonoma/runner/build-preview.mjs --demo --output "$RUNNER_TEMP/agency-fictional-demo"
          node agencia-autonoma/runner/build-preview.mjs --verify "$RUNNER_TEMP/agency-fictional-demo"
      - name: Preserve read-only fictional demo proof for manual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agency-fictional-demo
          path: ${{ runner.temp }}/agency-fictional-demo/
          if-no-files-found: error
          retention-days: 1
      - name: Simulate full fictional order lifecycle without a customer or bank
        shell: bash
        run: |
          set -euo pipefail
          node agencia-autonoma/runner/synthetic-order-sim.mjs --demo --output "$RUNNER_TEMP/agency-full-dryrun"
          node agencia-autonoma/runner/synthetic-order-sim.mjs --verify "$RUNNER_TEMP/agency-full-dryrun"
      - name: Preserve fictional end-to-end order packet for owner review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agency-fictional-full-order-review
          path: ${{ runner.temp }}/agency-full-dryrun/
          retention-days: 1
          if-no-files-found: error
      - name: Read-only production health check for agency public site and API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 25 --retry 2 --retry-delay 2 \
            https://br-falling-night-b57zpkln-agencialeads.compute.c-7.us-east-2.aws.neon.tech/health \
            -o "$RUNNER_TEMP/agency-health.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'agency-health.json').read_text())
          assert d.get('ok') is True and d.get('database')=='verified', 'live intake health failed'
          print('PASS: Neon database checked through deployed public API')
          PY
          curl --fail --silent --show-error --location --max-time 25 --retry 2 --retry-delay 2 \
            https://autonoma-dev-agencia-v2.onrender.com/ -o "$RUNNER_TEMP/agency-page.html"
          python3 - <<'PY'
          import os
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'agency-page.html').read_text()
          assert '<title>Autónoma Dev' in s and 'id="contactForm"' in s, 'production landing mismatch'
          print('PASS: production landing and contact form accessible')
          PY
      - name: Confirm deployed owner verification and denied unauthenticated CRM access
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 25 \
            https://autonoma-dev-agencia-v2.onrender.com/admin/ -o "$RUNNER_TEMP/agency-owner-login.html"
          python3 - <<'PY'
          import os
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'agency-owner-login.html').read_text()
          assert 'id="sendVerifyEmail"' in s and 'id="confirmVerifyEmail"' in s, 'verification UI missing'
          assert 'email-otp/verify-email' in s, 'Neon OTP verification action missing'
          assert "fetch(authBase+'/token'" in s, 'direct Neon Auth token flow missing from Render'
          assert 'auth.token()' not in s, 'deprecated cached SDK token flow published'
          print('PASS: owner OTP verification UI is published')
          PY
          status=$(curl --silent --show-error --max-time 25 -o "$RUNNER_TEMP/admin-denied.json" -w "%{http_code}" \
            -H "Origin: https://autonoma-dev-agencia-v2.onrender.com" \
            https://br-falling-night-b57zpkln-agenciaadmin.compute.c-7.us-east-2.aws.neon.tech/api/admin/leads)
          test "$status" = "401" || (echo "Unexpected admin access HTTP $status"; exit 1)
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'admin-denied.json').read_text())
          assert d.get('error')=='unauthorized', 'unexpected admin response'
          print('PASS: unauthenticated Neon CRM access still blocked')
          PY
      - name: Validate agency-only skill metadata and preserved original skills
        run: |
          python3 - <<'PY'
          from pathlib import Path
          names=[
              'agencia-arquitecto','agencia-cobranzas','agencia-entregas',
              'agencia-estimador','agencia-intake','agencia-programador',
              'agencia-prospeccion','agencia-qa','agencia-soporte']
          for name in names:
              f=Path('.claude/skills')/name/'SKILL.md'
              assert f.exists(),f
              assert f.read_text(encoding='utf8').startswith('---\nname: '+name+'\n'),name
          for existing in ['catalogo-editorial-raices','diseno-web-profesional']:
              assert (Path('.claude/skills')/existing/'SKILL.md').exists()
          print('PASS: agency 9/9, previous skills preserved')
          PY
      - name: Verify unsafe cross-app coupling not introduced
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('agencia-autonoma/neon').glob('*.mjs'))
          assert files
          for f in files:
              x=f.read_text(encoding='utf8')
              assert 'raicesregalos' not in x.lower()
              assert 'mayor-studio' not in x.lower()
          print('PASS: agency backend isolation')
          PY
