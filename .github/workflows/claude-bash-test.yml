name: Claude Code - Whitelisted Test Command

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/claude-bash-test.yml'
      - '.github/agent/claude_bash_audit.py'
      - '.github/agent/test_claude_bash_audit.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/claude-bash-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-bash-test-approval
  cancel-in-progress: false

jobs:
  command-proof:
    if: >-
      github.repository == 'adedramaa/freellmapi' &&
      (github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'test(claude-bash):')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout without stored push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prove exact command checks offline, without API secrets
        run: python3 -m unittest discover -s .github/agent -p test_claude_bash_audit.py -v

      - name: Install official Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.296

      - name: Verify installed CLI
        run: claude --version

      - name: Run only one whitelisted unit-test command through real Bash tool
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'test(claude-bash):'))
        env:
          ANTHROPIC_BASE_URL: https://adedrama-freellmapi.onrender.com
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.FREELLMAPI_API_KEY }}
          ANTHROPIC_MODEL: openai/gpt-oss-20b
          CLAUDE_CODE_SIMPLE: '1'
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: '384'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANTHROPIC_AUTH_TOKEN" ]]; then
            echo "Missing FreeLLMAPI unified key."
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Source checkout not clean before the test."
            exit 1
          fi
          SANDBOX="$(mktemp -d "$RUNNER_TEMP/claude-bash-XXXXXX")"
          printf 'import unittest\n\nclass BasicMath(unittest.TestCase):\n    def test_product(self):\n        self.assertEqual(7 * 6, 42)\n' > "$SANDBOX/test_demo.py"
          cd "$SANDBOX"
          echo "Launching official Claude Code with only one permitted Bash command."
          if ! timeout 155 claude --bare -p \
            "Run exactly this test command with the Bash tool, without changing it: python3 -m unittest test_demo.py. Then report that the test ran. Do not use any other command or tool." \
            --model "$ANTHROPIC_MODEL" --max-turns 2 \
            --tools Bash --allowedTools "Bash(python3 -m unittest test_demo.py)" \
            --permission-mode dontAsk --strict-mcp-config \
            --disable-slash-commands --no-session-persistence \
            --system-prompt "You may only run the precise preapproved unit test. No network, writing or other commands." \
            --output-format stream-json --verbose \
            > "$RUNNER_TEMP/claude-bash.jsonl" 2> "$RUNNER_TEMP/claude-bash.stderr"; then
            echo "Claude Code did not complete the restricted Bash test."
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          python3 .github/agent/claude_bash_audit.py "$RUNNER_TEMP/claude-bash.jsonl"
          if [[ "$(find "$SANDBOX" -type f | wc -l)" -ne 1 ]]; then
            echo "FAIL: Bash created extra files in temp directory."
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "FAIL: checkout changed during restricted Bash run."
            exit 1
          fi
          echo "PASS: Claude Code Bash used only the exact preapproved unit test."
