name: DesignCraft CLI real smoke test
on:
  push:
    branches: [designcraft-mcp-prototype]
    paths:
      - 'designcraft-autonomo/**'
      - '.github/workflows/designcraft-smoke.yml'
  workflow_dispatch:
jobs:
  real-cli-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install DesignCraft v0.14.0 and CLI
        run: |
          set -euxo pipefail
          curl --fail --show-error --location --retry 3 --output /tmp/designcraft.deb \
            'https://github.com/storytold/designcraft/releases/download/v0.14.0/designcraft-0.14.0-linux-x86_64.deb'
          sudo apt-get update
          sudo apt-get install -y /tmp/designcraft.deb
          designcraft-cli --help
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bridge unit tests
        working-directory: designcraft-autonomo
        env:
          MCP_BEARER_TOKEN: this-is-a-test-only-secret-not-for-real-deployments
        run: |
          python -m pip install fastapi uvicorn httpx pytest
          python -m pytest -q
      - name: Run real DesignCraft MCP and render A4 page
        run: python designcraft-autonomo/tests/smoke_real_cli.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: designcraft-real-smoke-files
          path: /tmp/designcraft-smoke/output/
          if-no-files-found: ignore
          retention-days: 2
