name: RETIRADO - Misterio antiguo en escritorio
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: No generar contenido fuera de la norma 3D
        shell: bash
        run: |
          echo "Este flujo quedó retirado. Todos los nuevos videos deben usar Blender 3D con acciones, cámaras y escenarios físicos."
          echo "Flujo vigente: .github/workflows/misterio-blender3d-obligatorio.yml"
          exit 1
