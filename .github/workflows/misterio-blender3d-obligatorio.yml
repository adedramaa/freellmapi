name: MISTERIO - Blender 3D obligatorio
on:
  push:
    branches: [fabrica-gratis-prototipo]
    paths:
      - 'fabrica_free/audio/narrador_original_ep01.opus'
      - 'fabrica_free/blender_noir_3d.py'
      - 'fabrica_free/subtitles_narrator3d.py'
      - '.github/workflows/misterio-blender3d-obligatorio.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Vista previa 3D o capítulo completo'
        required: false
        type: choice
        default: preview
        options: [preview, full]
permissions:
  contents: read
concurrency:
  group: misterio-blender-real-${{ github.event.inputs.mode || 'preview' }}
  cancel-in-progress: false
jobs:
  verdadero-blender-3d:
    if: github.repository == 'adedramaa/freellmapi' && github.ref == 'refs/heads/fabrica-gratis-prototipo'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require approved narration and real Blender animation
        shell: bash
        run: |
          set -euo pipefail
          test -s fabrica_free/audio/narrador_original_ep01.opus
          python3 -m py_compile fabrica_free/blender_noir_3d.py fabrica_free/subtitles_narrator3d.py
          if grep -Eq 'engine\.animatic|moviepy|scene_[0-9][0-9]\.jpg' fabrica_free/blender_noir_3d.py; then
            echo "Rejected: no still-image animatic pipeline allowed" >&2
            exit 1
          fi
          echo "Blender 3D and preserved narrator required" >> "$GITHUB_STEP_SUMMARY"

      - name: Install portable Blender and FFmpeg without apt
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/portable"
          BLENDER_ARCHIVE="$RUNNER_TEMP/portable/blender.tar.xz"
          echo "Download official Blender 5.2.2 (portable, no apt package index)"
          curl -fSL --retry 2 --connect-timeout 20 --max-time 480 --progress-bar \
            "https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz" \
            -o "$BLENDER_ARCHIVE"
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $BLENDER_ARCHIVE" | sha256sum -c -
          tar -xJf "$BLENDER_ARCHIVE" -C "$RUNNER_TEMP/portable"
          rm -f "$BLENDER_ARCHIVE"
          BLENDER_BIN="$RUNNER_TEMP/portable/blender-5.2.2-linux-x64/blender"
          test -x "$BLENDER_BIN"
          ln -s "$BLENDER_BIN" "$RUNNER_TEMP/portable/blender"
          echo "$RUNNER_TEMP/portable" >> "$GITHUB_PATH"
          "$BLENDER_BIN" -b --factory-startup --version | head -n 1
          echo "Download portable FFmpeg + FFprobe (original factory build)"
          FFMPEG_ARCHIVE="$RUNNER_TEMP/portable/ffmpeg.tar.xz"
          FFMPEG_FILE="ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz"
          FFMPEG_BASE="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          curl -fSL --retry 2 --connect-timeout 20 --max-time 240 --progress-bar \
            "$FFMPEG_BASE/$FFMPEG_FILE" -o "$FFMPEG_ARCHIVE"
          curl -fSL --retry 2 --connect-timeout 20 --max-time 35 \
            "$FFMPEG_BASE/checksums.sha256" -o "$RUNNER_TEMP/portable/ffmpeg-checksums.sha256"
          EXPECTED="$(grep -F "$FFMPEG_FILE" "$RUNNER_TEMP/portable/ffmpeg-checksums.sha256" | head -1 | awk '{print $1}')"
          test -n "$EXPECTED"
          printf '%s  %s\n' "$EXPECTED" "$FFMPEG_ARCHIVE" | sha256sum -c -
          tar -xJf "$FFMPEG_ARCHIVE" -C "$RUNNER_TEMP/portable"
          rm -f "$FFMPEG_ARCHIVE"
          FFMPEG_PATH="$RUNNER_TEMP/portable/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin"
          test -x "$FFMPEG_PATH/ffmpeg"
          test -x "$FFMPEG_PATH/ffprobe"
          ln -s "$FFMPEG_PATH/ffmpeg" "$RUNNER_TEMP/portable/ffmpeg"
          ln -s "$FFMPEG_PATH/ffprobe" "$RUNNER_TEMP/portable/ffprobe"
          "$FFMPEG_PATH/ffmpeg" -hide_banner -version | head -n 1
          "$FFMPEG_PATH/ffprobe" -v error -show_entries format=duration -of default=nw=1:nk=1 \
            fabrica_free/audio/narrador_original_ep01.opus

      - name: Build and mechanically verify physical animated Blender set
        env:
          MODE: ${{ github.event.inputs.mode || 'preview' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender3d/frames"
          EXTRA=""
          if [ "$MODE" = "preview" ]; then EXTRA="--preview"; fi
          blender -b -t 4 --python fabrica_free/blender_noir_3d.py -- \
            --out "$RUNNER_TEMP/blender3d/noir_scene.blend" --width 432 --height 768 \
            --fps 10 --samples 6 $EXTRA
          test -s "$RUNNER_TEMP/blender3d/noir_scene.blend"
          python3 - "$RUNNER_TEMP/blender3d/noir_scene.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data['renderer']=='Blender Cycles CPU'
          assert data['format']=='true keyframed 3D'
          assert data['slideshow'] is False and data['narrator_visible'] is False
          assert len(data['camera_shots'])==12
          assert len(data['animated_objects'])>=5
          print('3D_GATES_ALL_PASSED')
          PY

      - name: Render consecutive actual 3D animation frames (not a slideshow)
        timeout-minutes: 47
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 4 "$RUNNER_TEMP/blender3d/noir_scene.blend" -a > "$RUNNER_TEMP/blender3d/blender_render.log" 2>&1 || {
            tail -80 "$RUNNER_TEMP/blender3d/blender_render.log"
            exit 1
          }
          count=$(find "$RUNNER_TEMP/blender3d/frames" -name 'frame_*.png' -type f | wc -l)
          echo "BLENDER_3D_FRAMES=$count" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$count" -ge 75

      - name: Compose approved voiceover and synchronized subtitles on rendered animation
        env:
          MODE: ${{ github.event.inputs.mode || 'preview' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 fabrica_free/subtitles_narrator3d.py "$RUNNER_TEMP/blender3d/subtitles.ass"
          DUR=32.8
          SUFFIX=completo
          if [ "$MODE" = "preview" ]; then DUR=7.8;SUFFIX=prueba; fi
          mkdir -p fabrica_free/blender3d_result
          OUTPUT="fabrica_free/blender3d_result/capitulo1_blender3d_$SUFFIX.mp4"
          ffmpeg -hide_banner -loglevel error -y -threads 4 \
            -framerate 10 -start_number 1 -i "$RUNNER_TEMP/blender3d/frames/frame_%04d.png" \
            -i fabrica_free/audio/narrador_original_ep01.opus \
            -vf "fps=24,scale=1080:1920:flags=lanczos,subtitles=$RUNNER_TEMP/blender3d/subtitles.ass" \
            -map 0:v:0 -map 1:a:0 -t "$DUR" -c:v libx264 -preset veryfast -crf 21 \
            -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart "$OUTPUT"
          test -s "$OUTPUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$OUTPUT" | grep -qx '1080,1920'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$OUTPUT" | grep -qx 'aac'
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "BLENDER_3D_MP4_VERIFIED=$OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload real 3D result with Blender source and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misterio-blender3d-${{ github.event.inputs.mode || 'preview' }}-${{ github.run_id }}
          path: |
            fabrica_free/blender3d_result/*.mp4
            ${{ runner.temp }}/blender3d/noir_scene.blend
            ${{ runner.temp }}/blender3d/noir_scene.json
          retention-days: 5
          if-no-files-found: warn
